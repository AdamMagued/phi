name: Release Drafter

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  draft-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract release notes from CHANGELOG.md
        id: changelog
        run: |
          NOTES="${RUNNER_TEMP}/release-notes.md"
          scripts/changelog-extract.sh "${GITHUB_REF_NAME}" > "$NOTES"
          echo "path=$NOTES" >> "$GITHUB_OUTPUT"
          echo "---- release notes ----"
          cat "$NOTES"

      - name: Create or update release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"

          # Check if a release for this tag already exists
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file "${{ steps.changelog.outputs.path }}"
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file "${{ steps.changelog.outputs.path }}" \
              --draft
          fi
