name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            test-command: make test
          - os: macos-latest
            test-command: make test
          - os: windows-latest
            test-command: go test ./...
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # Pin to go.mod — `stable` can jump ahead of golangci-lint's build Go.
          go-version-file: go.mod

      - name: Run tests
        run: ${{ matrix.test-command }}

  ext-sdk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test Go ext module
        run: go test ./...
        working-directory: ext/go

  ext-sdk-rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Test Rust ext module
        run: cargo test --all-targets
        working-directory: ext/rust

      - name: Check Rust ext module
        run: cargo fmt --check && cargo clippy --all-targets -- -D warnings
        working-directory: ext/rust

  ext-sdk-ts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # The suite runs TypeScript through Node's type stripping, so it needs
          # Node >= 23.6; the package's engines (>= 20) only covers built dist/.
          node-version: 24

      # ext/ts/package-lock.json is gitignored (same call as ext/rust's
      # Cargo.lock), so this cannot be `npm ci` and setup-node cannot key an npm
      # cache: it hashes cache-dependency-path, and a missing lockfile fails the
      # step outright. Three dev deps install in under a second anyway.
      - name: Install
        run: npm install --no-audit --no-fund
        working-directory: ext/ts

      # Same gate as the prepublishOnly hook: typecheck, tests, then prove
      # dist/ still emits (the published tarball ships dist/ only).
      - name: Check
        run: npm run check && npm run build
        working-directory: ext/ts

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.0
          install-only: true

      - name: Install deadcode
        run: go install golang.org/x/tools/cmd/deadcode@v0.49.0

      - name: Check
        run: make check
